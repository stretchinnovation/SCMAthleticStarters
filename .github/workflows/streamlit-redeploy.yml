permissions:
  contents: write


name: Force Streamlit Redeploy

on:
  push:
    branches:
      - AthleticStarters
    paths:
      - '**.csv'

jobs:
  force-redeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Update timestamp in dummy file
        run: |
          echo "# redeploy trigger $(date)" > redeploy_trigger.py
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add redeploy_trigger.py
          git commit -m "Trigger redeploy"
          git push
